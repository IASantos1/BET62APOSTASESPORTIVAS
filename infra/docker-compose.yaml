services:
  postgres:
    image: postgres:16-alpine
    container_name: bet62-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bet62}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Bet62!StrongPass2026}
      POSTGRES_DB: ${POSTGRES_DB:-bet62_platform}
    ports:
      - "5432:5432"
    volumes:
      - bet62_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bet62}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - bet62-net

  redis:
    image: redis:7-alpine
    container_name: bet62-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Bet62RedisPass!2026}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - bet62_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Bet62RedisPass!2026}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - bet62-net

  redisinsight:
    image: redis/redisinsight:latest
    container_name: bet62-redisinsight
    restart: unless-stopped
    ports:
      - "8001:5540"
    environment:
      - RI_REDISINSIGHT_PORT=5540
    volumes:
      - bet62_redisinsight_data:/data
    depends_on:
      - redis
    networks:
      - bet62-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: bet62-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@bet62.pt
      PGADMIN_DEFAULT_PASSWORD: Bet62Admin!2026
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:5050"
    volumes:
      - bet62_pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - bet62-net

  nginx:
    image: nginx:1.25-alpine
    container_name: bet62-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - bet62_nginx_logs:/var/log/nginx
    depends_on:
      - api-gateway
      - web
    networks:
      - bet62-net

  api-gateway:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.node
      args:
        SERVICE_DIR: services/api-gateway
        SERVICE_PORT: 3000
    container_name: bet62-api-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../.env
    networks:
      - bet62-net
    profiles:
      - services

  auth-service:
