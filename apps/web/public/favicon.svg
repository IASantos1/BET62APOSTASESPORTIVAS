<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </radialGradient>
    <filter id="neon-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-pink" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#00ff9d" stroke-width="1.2" opacity="0.35"/>
  <circle cx="64" cy="64" r="44" fill="none" stroke="#ff00ea" stroke-width="1.2" opacity="0.35"/>
  <circle cx="64" cy="64" r="36" fill="none" stroke="#00d4ff" stroke-width="1.2" opacity="0.35"/>

  <text x="64" y="76"
        text-anchor="middle"
        font-family="'Space Grotesk', 'Inter', sans-serif"
        font-size="48"
        font-weight="800"
        letter-spacing="0"
        fill="#00ff9d"
        filter="url(#neon-green)"
        style="paint-order: stroke;">
    BET
  </text>
  <text x="112" y="82"
        text-anchor="middle"
        font-family="'Space Grotesk', sans-serif"
        font-size="36"
        font-weight="800"
        fill="#ff00ea"
        filter="url(#neon-pink)">
    62
  </text>

  <circle cx="24" cy="104" r="3.5" fill="#00ff9d" filter="url(#neon-green)"/>
  <circle cx="104" cy="24" r="3.5" fill="#ff00ea" filter="url(#neon-pink)"/>
  <circle cx="104" cy="104" r="3" fill="#00d4ff" filter="url(#neon-cyan)"/>
  <circle cx="24" cy="24" r="3" fill="#00d4ff" filter="url(#neon-cyan)"/>
</svg>
